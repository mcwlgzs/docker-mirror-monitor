# =============================================================================
# Docker 镜像加速服务监控 - Nginx 站点配置
#
# 设计取舍：
#   * 静态页面（index.html / script.js / theme.js）由 nginx 直接返回，
#     只有 /api.php 交给 PHP-FPM —— 监控页面的主要成本在前端的探测请求，
#     静态资源走 nginx 可以避免把 worker 浪费在 sendfile 场景上。
#   * 除白名单之外的所有 .php 一律 404，防止误放测试脚本或后门文件被执行。
#   * 限流放在 nginx 层，PHP 里还有一层按 IP 的滑动窗口，双层保护。
# =============================================================================

limit_req_zone $binary_remote_addr zone=dmm_api:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 必须与 nginx 镜像里 COPY 的目标目录一致（见 docker/nginx/Dockerfile）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 探测请求会带上 json 请求体，1m 已经非常宽松
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 页面依赖 Tailwind CDN 与 Font Awesome CDN，以及同源数据接口，
    # 因此 CSP 需要放行这两个 CDN（自建时可改成把资源本地化后收紧）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 健康检查（同时用于容器探针）----
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"docker-mirror-monitor"}';
    }

    # ---- API ----
    location = /api.php {
        limit_req zone=dmm_api burst=30 nodelay;

        # 交给 PHP-FPM（同网络的服务名 php）
        # 注意：nginx 与 php 容器文件系统相互独立，$document_root 指向 nginx 自己的
        # 静态目录，PHP 侧并不存在，因此 SCRIPT_FILENAME 必须写 php 容器内的绝对路径。
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api.php;
        fastcgi_param SCRIPT_NAME /api.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html;

        fastcgi_read_timeout 40s;
        fastcgi_send_timeout 40s;
        fastcgi_buffering off;

        # API 响应绝不能被缓存（缓存逻辑由 api.php + data/cache 自己控制）
        add_header Cache-Control "no-store, max-age=0" always;
    }

    # ---- 其余 .php 一律拒绝，避免误部署的脚本被执行 ----
    location ~ \.php$ {
        return 404;
    }

    # ---- 隐藏内部文件（自检页、后端源码、部署配置不应对外暴露）----
    # try_files 必须终止于 =404；若写成 /index.html，该 URI 会再次命中本块形成
    # 「rewrite or internal redirection cycle」并返回 500。
    location = /test.html {
        return 404;
    }

    location ~ ^/(config\.php|lib\.php|selftest\.php|pretty_json\.php|check_config_errors\.php|check_service_shape\.php|mirror_candidates\.php|docker-compose\.yml|docker-compose\.override\.yml|Dockerfile|\.env.*|\.dockerignore|\.gitignore)$ {
        return 404;
    }

    location ~ ^/(docker|scripts)/ {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- 静态资源 ----
    # 注意：.html 不参与长缓存，避免升级后页面与接口不匹配
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

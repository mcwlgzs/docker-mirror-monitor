; =============================================================================
; Docker 镜像加速服务监控 - PHP-FPM 运行时配置
; =============================================================================

[global]
; 容器里 PID 1 由 tini/php-fpm 处理，错误日志直接输出到 stderr 交给 docker logs
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data

; 与 nginx 同处一个 Docker 私有网络，直接走 TCP 更简单也更省心：
; unix socket 需要两个容器共享一个可写卷并协调 UID，容器化下没有收益。
; 该端口只在 compose 内部网络暴露，不映射到宿主机。
listen = 0.0.0.0:9000

; 容器内通常 1~2 个 worker 足够：探测是 curl_multi 并发，PHP 侧是 IO 等待
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; 访问日志交给 nginx，避免重复
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; 单次探测最长 8s 超时 + 缓存写入，30s 上限足够；防止请求挂死拖垮 worker
request_terminate_timeout = 30s

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = Off
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M
; 上传关闭（本项目不需要任何上传），降低攻击面
php_admin_value[file_uploads] = Off
php_admin_value[expose_php] = Off

; 时区：容器里可通过 TZ 环境变量覆盖，非法值会被 lib.php 回退到 Asia/Shanghai
php_admin_value[date.timezone] = Asia/Shanghai

; CA 证书：Alpine 的 ca-certificates 包会装到 /etc/ssl/certs/ca-certificates.crt，
; lib.php 会自动探测；这里显式指定，避免 php.ini 缺省为空导致 HTTPS 探测全部失败。
php_admin_value[curl.cainfo] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt

; 生产环境关闭 opcache 的时间戳校验会更快，但本项目需要随改随生效，
; 保留默认（validate_timestamps=1）。
